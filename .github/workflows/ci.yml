name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore test and build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
