name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        # You may pin to the exact commit or the version.
        # uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        uses: pnpm/action-setup@v6.0.10
        with:
          cache: true
  
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Restore test and build cache
        id: test-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Save test and build cache
        if: success() && steps.test-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
