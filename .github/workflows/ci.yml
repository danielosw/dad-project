name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore test and build cache
        id: test-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Save test and build cache
        if: success() && steps.test-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
